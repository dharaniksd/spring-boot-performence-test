# =============================================================================
# PROD profile – conservative, secure, high-throughput defaults
# Activate with: -Dspring.profiles.active=prod  or  SPRING_PROFILES_ACTIVE=prod
# =============================================================================

server:
  port: 8080
  tomcat:
    threads:
      max: 300
      min-spare: 25
    accept-count: 150
    connection-timeout: 15000
    keep-alive-timeout: 30000
    max-keep-alive-requests: 150

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        # Restrict actuator surface in production – add heapdump carefully
        include: health,info,metrics,prometheus

# Minimal logging in production
logging:
  level:
    root: WARN
    com.dharaniksd.performence: INFO

spring:
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 5000
