# =============================================================================
# PERF profile – medium/high capacity for load and performance testing
# Activate with: -Dspring.profiles.active=perf  or  SPRING_PROFILES_ACTIVE=perf
# =============================================================================

server:
  port: 8080
  tomcat:
    threads:
      max: 400        # higher concurrency for load testing
      min-spare: 50
    accept-count: 200
    connection-timeout: 10000
    keep-alive-timeout: 30000
    max-keep-alive-requests: 200

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,heapdump

# Suppress debug noise during load tests
logging:
  level:
    root: WARN
    com.dharaniksd.performence: INFO

spring:
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 5000
